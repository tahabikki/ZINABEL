version: "3.8"

services:
  backend:
    build: .
    image: zinabel:latest
    ports:
      - "5000:5000"
    env_file: .env
    environment:
      PORT: ${PORT:-5000}
      BROWSER_PATH: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/local/bin/chromedriver
    volumes:
      - zinabel_data:/app/database
    restart: unless-stopped
    shm_size: '1g'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: zinabel-frontend:latest
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Client-facing API URL (browser) - use relative path so browser requests go through the dev server
      VITE_API_URL: /api
      # Dev server proxy target (the dev server runs inside the container and should forward to backend)
      VITE_PROXY_TARGET: http://backend:5000
      CHOKIDAR_USEPOLLING: "true"
      BROWSER: "none"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  zinabel_data:
